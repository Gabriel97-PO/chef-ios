name: Build & Test

on:
  push:
  workflow_dispatch:

jobs:
  chef-core:
    name: ChefCore (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: swift test
        working-directory: Packages/ChefCore
        run: swift test

  chef-app:
    name: Chef app (xcodebuild)
    runs-on: macos-15
    needs: chef-core
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls /Applications | grep -i Xcode
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Available iOS SDKs
        run: xcodebuild -showsdks | grep -i ios || true

      - name: List available simulators
        run: xcrun simctl list devices available | grep -i iphone || true

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -scheme Chef \
            -destination 'generic/platform=iOS Simulator'

      - name: Test on Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' || echo "iPhone 16")
          echo "Using device: $DEVICE"
          xcodebuild test \
            -scheme Chef \
            -destination "platform=iOS Simulator,name=$DEVICE"
