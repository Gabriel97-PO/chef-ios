name: Build & Test

on:
  push:
  workflow_dispatch:

jobs:
  chef-core:
    name: ChefCore (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: swift test
        working-directory: Packages/ChefCore
        run: swift test

  chef-app:
    name: Chef app (xcodebuild)
    runs-on: macos-15
    needs: chef-core
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls /Applications | grep -i Xcode
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Available iOS SDKs
        run: xcodebuild -showsdks | grep -i ios || true

      - name: Pick a simulator device
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' || echo "iPhone 16")
          echo "device=$DEVICE" >> "$GITHUB_ENV"
          echo "Using device: $DEVICE"

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -scheme Chef \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath build

      - name: Test on Simulator
        run: |
          xcodebuild test \
            -scheme Chef \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath build

      - name: Screenshot the running app
        run: |
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          APP_PATH=$(find build/Build/Products -maxdepth 3 -name "Chef.app" -path "*iphonesimulator*" | head -n1)
          echo "App at: $APP_PATH"
          xcrun simctl install "$device" "$APP_PATH"
          xcrun simctl launch "$device" com.chef.app
          sleep 4
          mkdir -p screenshots
          xcrun simctl io "$device" screenshot screenshots/hoje.png
          xcrun simctl shutdown "$device" || true

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: chef-screenshots
          path: screenshots/*.png
