name: Build & Test

on:
  push:
  workflow_dispatch:

jobs:
  chef-core:
    name: ChefCore (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: swift test
        working-directory: Packages/ChefCore
        run: swift test

  chef-app:
    name: Chef app (xcodebuild)
    runs-on: macos-15
    needs: chef-core
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls /Applications | grep -i Xcode
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Available iOS SDKs
        run: xcodebuild -showsdks | grep -i ios || true

      - name: Pick a simulator device
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' || echo "iPhone 16")
          # O UDID é necessário pro passo de tema escuro: o xcodebuild
          # desliga o simulador quando termina, então "simctl ui booted"
          # não acha dispositivo nenhum depois dos testes.
          UDID=$(xcrun simctl list devices available | grep -m1 "$DEVICE (" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "device=$DEVICE" >> "$GITHUB_ENV"
          echo "udid=$UDID" >> "$GITHUB_ENV"
          echo "Using device: $DEVICE ($UDID)"

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -scheme Chef \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath build

      - name: Test on Simulator (unit + UI tests)
        run: |
          rm -rf build/TestResults.xcresult
          xcodebuild test \
            -scheme Chef \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath build \
            -skip-testing:ChefUITests/DarkModeScreenshotUITests \
            -resultBundlePath build/TestResults.xcresult

      # XCUIDevice.shared.appearance não surte efeito aqui — o app sobe no
      # tema claro de qualquer jeito. Quem troca a aparência de verdade é o
      # simctl, daí a classe de teste escura rodar num passo próprio.
      - name: Dark mode screenshots
        run: |
          rm -rf build/DarkResults.xcresult
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b || true
          xcrun simctl ui "$udid" appearance dark
          xcodebuild test \
            -scheme Chef \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build \
            -only-testing:ChefUITests/DarkModeScreenshotUITests \
            -resultBundlePath build/DarkResults.xcresult

      - name: Export screenshots from the UI test result bundles
        run: |
          mkdir -p screenshots/light screenshots/dark
          xcrun xcresulttool export attachments \
            --path build/TestResults.xcresult \
            --output-path screenshots/light
          xcrun xcresulttool export attachments \
            --path build/DarkResults.xcresult \
            --output-path screenshots/dark
          ls -la screenshots/light screenshots/dark

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: chef-screenshots
          path: screenshots/**

  chef-ipa:
    name: Chef app (device .ipa for sideloading)
    runs-on: macos-15
    needs: chef-core
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Sem conta de Apple Developer, não há como assinar de verdade no CI.
      # AD_HOC_CODE_SIGNING_ALLOWED=YES gera uma assinatura fake local (só
      # pra satisfazer o formato do binário) — é o AltServer quem assina de
      # verdade com o Apple ID do usuário no momento da instalação.
      - name: Archive for a real device (unsigned)
        run: |
          xcodebuild archive \
            -scheme Chef \
            -archivePath build/Chef.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/Chef.xcarchive/Products/Applications/Chef.app build/Payload/
          cd build && zip -r Chef.ipa Payload
          cd ..
          ls -la build/Chef.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: chef-ipa
          path: build/Chef.ipa
