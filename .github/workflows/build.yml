name: Build & Test

on:
  push:
  workflow_dispatch:
    inputs:
      dark_screenshots:
        description: "Also capture dark-mode screenshots (roda o app de novo do zero, deixa o CI mais lento — só liga quando precisar checar o tema escuro)"
        type: boolean
        default: false

jobs:
  chef-core:
    name: ChefCore (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: swift test
        working-directory: Packages/ChefCore
        run: swift test

  chef-app:
    name: Chef app (xcodebuild)
    runs-on: macos-15
    needs: chef-core
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls /Applications | grep -i Xcode
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Available iOS SDKs
        run: xcodebuild -showsdks | grep -i ios || true

      - name: Pick a simulator device
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' || echo "iPhone 16")
          # O UDID vem do -showdestinations do próprio scheme, não do
          # simctl: o simctl lista iPhones de runtimes antigos (iOS 18) que
          # não servem de destino pro nosso target iOS 26, e pegar um deles
          # dá "Unable to find a destination".
          UDID=$(xcodebuild -showdestinations -scheme Chef 2>/dev/null \
            | grep "platform:iOS Simulator" \
            | grep "name:iPhone" \
            | grep -oE 'id:[0-9A-Fa-f-]{36}' \
            | head -n1 | cut -d: -f2)
          echo "device=$DEVICE" >> "$GITHUB_ENV"
          echo "udid=$UDID" >> "$GITHUB_ENV"
          echo "Using device: $DEVICE ($UDID)"

      # Um simulador novo nesse runner nasce em modo escuro por padrão —
      # sem forçar claro aqui, os screenshots e testes "normais" (que
      # deveriam ser modo claro) saíam escuros de verdade. Só apareceu
      # porque o passo de modo escuro, que antes deixava tudo de volta em
      # claro no fim, virou opcional e passou a não rodar mais nos pushes
      # normais.
      # timeout-minutes evita repetir o incidente de 22/set: "simctl
      # bootstatus -b" ficou preso mais de 40 minutos num runner (o
      # simulador nunca terminou de reportar o boot), e sem limite o job
      # só ia parar na hora do timeout padrão do GitHub Actions (6h).
      - name: Force light appearance on the simulator
        timeout-minutes: 2
        run: |
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b || true
          xcrun simctl ui "$udid" appearance light

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -scheme Chef \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath build

      - name: Test on Simulator (unit + UI tests)
        run: |
          rm -rf build/TestResults.xcresult
          xcodebuild test \
            -scheme Chef \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath build \
            -skip-testing:ChefUITests/DarkModeScreenshotUITests \
            -resultBundlePath build/TestResults.xcresult

      # XCUIDevice.shared.appearance não surte efeito aqui — o app sobe no
      # tema claro de qualquer jeito. Quem troca a aparência de verdade é o
      # simctl, daí a classe de teste escura rodar num passo próprio — que
      # reabre o simulador e roda a suíte inteira de novo do zero, dobrando
      # o tempo desse job. Por isso é opt-in (workflow_dispatch com
      # dark_screenshots=true), não roda em todo push.
      - name: Dark mode screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.dark_screenshots == true
        run: |
          rm -rf build/DarkResults.xcresult
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b || true
          xcrun simctl ui "$udid" appearance dark
          xcodebuild test \
            -scheme Chef \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath build \
            -only-testing:ChefUITests/DarkModeScreenshotUITests \
            -resultBundlePath build/DarkResults.xcresult

      - name: Export screenshots from the UI test result bundles
        run: |
          mkdir -p screenshots/light
          xcrun xcresulttool export attachments \
            --path build/TestResults.xcresult \
            --output-path screenshots/light
          if [ -d build/DarkResults.xcresult ]; then
            mkdir -p screenshots/dark
            xcrun xcresulttool export attachments \
              --path build/DarkResults.xcresult \
              --output-path screenshots/dark
          fi
          ls -la screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: chef-screenshots
          path: screenshots/**

  chef-ipa:
    name: Chef app (device .ipa for sideloading)
    runs-on: macos-15
    needs: chef-core
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Sem conta de Apple Developer, não há como assinar de verdade no CI.
      # AD_HOC_CODE_SIGNING_ALLOWED=YES gera uma assinatura fake local (só
      # pra satisfazer o formato do binário) — é o AltServer quem assina de
      # verdade com o Apple ID do usuário no momento da instalação.
      - name: Archive for a real device (unsigned)
        run: |
          xcodebuild archive \
            -scheme Chef \
            -archivePath build/Chef.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/Chef.xcarchive/Products/Applications/Chef.app build/Payload/
          cd build && zip -r Chef.ipa Payload
          cd ..
          ls -la build/Chef.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: chef-ipa
          path: build/Chef.ipa
