name: Chef
options:
  bundleIdPrefix: com.chef.app
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  ChefCore:
    path: Packages/ChefCore

targets:
  Chef:
    type: application
    platform: iOS
    # O XcodeGen não tem chave "resources" — ela era ignorada em silêncio e
    # o asset catalog (ícone do app) nunca ia pro bundle. Tudo entra em
    # "sources", que classifica cada arquivo pelo tipo.
    sources:
      - path: ChefApp/Sources
      - path: ChefApp/Resources
    dependencies:
      - package: ChefCore
    info:
      path: Generated/Chef-Info.plist
      properties:
        CFBundleDisplayName: Chef
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "O Chef usa a câmera para escanear tabelas nutricionais e identificar se um produto cabe na sua dieta."
        NSHealthShareUsageDescription: "O Chef lê seu peso e percentual de gordura do Apple Saúde para acompanhar sua evolução com os dados da sua balança."
        NSHealthUpdateUsageDescription: "O Chef escreve no Apple Saúde as calorias e nutrientes que você registrou, para ficarem junto dos seus outros dados de saúde."
        CFBundleURLTypes:
          - CFBundleURLName: com.chef.app
            CFBundleURLSchemes: [chef]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chef.app
        PRODUCT_NAME: Chef
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES

  ChefTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChefApp/Tests
    dependencies:
      - target: Chef
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES

  ChefUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChefApp/UITests
    dependencies:
      - target: Chef
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Chef:
    build:
      targets:
        Chef: all
        ChefTests: [test]
        ChefUITests: [test]
    test:
      targets: [ChefTests, ChefUITests]
    run:
      config: Debug
