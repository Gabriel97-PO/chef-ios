name: Chef
options:
  bundleIdPrefix: com.chef.app
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  ChefCore:
    path: Packages/ChefCore

targets:
  Chef:
    type: application
    platform: iOS
    sources:
      - path: ChefApp/Sources
    resources:
      - path: ChefApp/Resources
    dependencies:
      - package: ChefCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chef.app
        PRODUCT_NAME: Chef
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chef
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "O Chef usa a câmera para escanear tabelas nutricionais e identificar se um produto cabe na sua dieta."
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES

  ChefTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChefApp/Tests
    dependencies:
      - target: Chef
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Chef:
    build:
      targets:
        Chef: all
        ChefTests: [test]
    test:
      targets: [ChefTests]
    run:
      config: Debug
